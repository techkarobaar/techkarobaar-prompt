<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechKarobaar Admin</title><style>body{background:#080b12;color:#f5f7fb;font:15px system-ui;padding:20px}.box{max-width:620px;margin:25px auto;background:#111725;border:1px solid #34445e;border-radius:16px;padding:22px}label{display:block;margin:13px 0 5px}input,textarea{width:100%;padding:11px;background:#080e18;color:white;border:1px solid #34445e;border-radius:9px}textarea{min-height:130px}button{padding:11px 15px;margin:12px 5px 0 0;border:0;border-radius:9px;background:#63e6ff;font-weight:800}.hide{display:none}.msg{color:#63e6ff;white-space:pre-wrap}</style></head><body><main class="box"><h1>TechKarobaar Admin</h1><p>Add your prompt and the Instagram Reel link that demonstrates it.</p><section id="auth"><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="signup">Create account</button><button id="login">Login</button><div id="authmsg" class="msg"></div><p>After signup, authorize your account using the UUID step in README.txt.</p></section><section id="panel" class="hide"><button id="logout">Log out</button><label>Prompt title</label><input id="title"><label>Category</label><input id="category" placeholder="Image generation, Video, etc."><label>Full prompt</label><textarea id="prompt"></textarea><label>Instagram Reel URL</label><input id="reel" placeholder="https://www.instagram.com/reel/..."><label><input type="checkbox" id="published" checked style="width:auto"> Publish now</label><button id="save">Save prompt</button><div id="msg" class="msg"></div><h2>Your prompts</h2><div id="items"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=s=>document.querySelector(s),ready=TK_CONFIG.supabaseUrl&&!TK_CONFIG.supabaseUrl.includes("YOUR_")&&TK_CONFIG.supabaseAnonKey&&!TK_CONFIG.supabaseAnonKey.includes("YOUR_"),db=ready?supabase.createClient(TK_CONFIG.supabaseUrl,TK_CONFIG.supabaseAnonKey):null;if(!db)$("#authmsg").textContent="Set Supabase URL and anon key in config.js first.";
async function admin(){let {data:{user}}=await db.auth.getUser();if(!user)return false;let {data}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();return !!data}
async function refresh(){if(!db)return;let ok=await admin();$("#auth").classList.toggle("hide",ok);$("#panel").classList.toggle("hide",!ok);if(ok)list()}
async function auth(signup){let email=$("#email").value,password=$("#password").value,r=signup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});$("#authmsg").textContent=r.error?.message||(signup?"Account created. Now authorize your UUID using README.txt.":"Login successful.");if(!signup&&!r.error)refresh()}
$("#signup").onclick=()=>auth(true);$("#login").onclick=()=>auth(false);$("#logout").onclick=async()=>{await db.auth.signOut();refresh()};
$("#save").onclick=async()=>{let title=$("#title").value.trim(),prompt=$("#prompt").value.trim(),reel=$("#reel").value.trim(),category=$("#category").value.trim()||"AI";if(!title||!prompt||!/^https:\/\/(www\.)?instagram\.com\//i.test(reel)){ $("#msg").textContent="Enter title, full prompt and a valid Instagram Reel URL.";return}let slug=title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now().toString(36);let {error}=await db.from("prompts").insert({title,prompt,reel_url:reel,category,slug,published:$("#published").checked});$("#msg").textContent=error?error.message:"Prompt saved!";if(!error){["#title","#category","#prompt","#reel"].forEach(s=>$(s).value="");list()}};
async function list(){let {data,error}=await db.from("prompts").select("id,title,published,slug").order("created_at",{ascending:false});$("#items").innerHTML=error?error.message:(data||[]).map(p=>`<p>${p.title} — ${p.published?"Live":"Draft"} <button data-del="${p.id}">Delete</button></p>`).join("")||"No prompts added yet.";document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("Delete prompt?")){await db.from("prompts").delete().eq("id",b.dataset.del);list()}})}
if(db){db.auth.onAuthStateChange(()=>refresh());refresh()}
</script></body></html>
