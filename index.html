<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechKarobaar AI Prompts</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b12;color:#f5f7fb;font:15px system-ui;padding:20px}.wrap{max-width:1000px;margin:auto}.nav{display:flex;justify-content:space-between}.brand{font-weight:900;font-size:20px}.brand span,h1 span,.tag{color:#63e6ff}a{color:inherit}.btn,button{display:inline-block;border:0;border-radius:10px;padding:11px 15px;background:#63e6ff;color:#061019;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#1b2940;color:white;border:1px solid #34445e}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(38px,8vw,65px);line-height:1.03;margin:10px 0}.muted{color:#9aa8bd}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input,.toolbar select{background:#111725;color:white;border:1px solid #34445e;border-radius:10px;padding:12px}.toolbar input{flex:1;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#111725;border:1px solid #29364b;border-radius:16px;overflow:hidden}.embed{padding:8px;background:#080b12;min-height:170px;display:grid;place-items:center}.embed blockquote{margin:0!important;max-width:100%!important}.body{padding:16px}.tag{font-size:11px;text-transform:uppercase}.body h3{margin:6px 0}.prompt{color:#aab6c8;white-space:pre-wrap;max-height:90px;overflow:hidden}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.empty{grid-column:1/-1;text-align:center;padding:35px;border:1px dashed #34445e;border-radius:15px;color:#9aa8bd}.foot{border-top:1px solid #29364b;margin-top:45px;padding:20px 0;color:#9aa8bd}@media(max-width:600px){.toolbar{flex-wrap:wrap}.toolbar input{width:100%}}</style></head><body><main class="wrap">
<header class="nav"><div class="brand">TECH<span>KAROBAAR</span></div><a id="topInsta" target="_blank">Instagram ↗</a></header>
<section class="hero"><div class="tag">FREE AI PROMPT LIBRARY</div><h1>Create smarter.<br><span>Make more.</span></h1><p class="muted">Prompts shared by TechKarobaar. Copy a prompt and watch the Instagram Reel that goes with it.</p><p><a class="btn" id="follow" target="_blank">Follow @techkarobaar ↗</a> <a class="btn secondary" href="#prompts">Explore prompts ↓</a></p></section>
<section id="prompts"><h2>Latest prompts</h2><div class="toolbar"><input id="q" placeholder="Search prompts…"><select id="cat"><option value="">All categories</option></select></div><div id="grid" class="grid"><div class="empty">Loading…</div></div></section><footer class="foot">© TechKarobaar · <a id="footInsta" target="_blank">@techkarobaar</a></footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=s=>document.querySelector(s),ig=TK_CONFIG.instagramUrl;["#topInsta","#follow","#footInsta"].forEach(s=>$(s).href=ig);
const configured=TK_CONFIG.supabaseUrl&&!TK_CONFIG.supabaseUrl.includes("YOUR_")&&TK_CONFIG.supabaseAnonKey&&!TK_CONFIG.supabaseAnonKey.includes("YOUR_");
const db=configured?supabase.createClient(TK_CONFIG.supabaseUrl,TK_CONFIG.supabaseAnonKey):null;let rows=[];
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){let q=$("#q").value.toLowerCase(),c=$("#cat").value;let a=rows.filter(x=>(!c||x.category===c)&&(`${x.title} ${x.category} ${x.prompt}`).toLowerCase().includes(q));$("#grid").innerHTML=a.length?a.map(x=>`<article class="card" id="p-${esc(x.slug)}"><div class="embed"><blockquote class="instagram-media" data-instgrm-permalink="${esc(x.reel_url)}" data-instgrm-version="14" style="background:#fff;border:0;border-radius:8px;width:100%"></blockquote></div><div class="body"><span class="tag">${esc(x.category)}</span><h3>${esc(x.title)}</h3><div class="prompt">${esc(x.prompt)}</div><div class="actions"><button data-copy="${x.id}">Copy Prompt</button><a class="btn secondary" href="${esc(x.reel_url)}" target="_blank">Watch Reel ↗</a></div></div></article>`).join(""):`<div class="empty"><h3>No prompts yet</h3><p>New prompts will appear here when TechKarobaar adds them.</p><a class="btn" href="${ig}" target="_blank">Follow on Instagram ↗</a></div>`;document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(rows.find(x=>x.id===b.dataset.copy).prompt);b.textContent="Copied!"});if(window.instgrm?.Embeds)instgrm.Embeds.process()}
$("#q").oninput=render;$("#cat").onchange=render;
async function load(){if(!db){$("#grid").innerHTML='<div class="empty">Connect Supabase in config.js to publish your prompt library. No sample prompts are included.</div>';return}let {data,error}=await db.from("prompts").select("*").eq("published",true).order("created_at",{ascending:false});if(error){$("#grid").innerHTML='<div class="empty">Unable to load prompts. Check setup.</div>';return}rows=data||[];let cats=[...new Set(rows.map(x=>x.category))];$("#cat").innerHTML='<option value="">All categories</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join("");render()}load();
</script><script async src="https://www.instagram.com/embed.js"></script></body></html>
